<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Mini-Golf 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #scoreboard {
            position: absolute; top: 20px; left: 20px;
            font-size: 24px; background: rgba(0,0,0,0.3);
            padding: 10px 20px; border-radius: 15px; border: 2px solid white;
        }

        #power-container {
            position: absolute; bottom: 40px; left: 50%;
            transform: translateX(-50%); width: 250px; height: 20px;
            background: rgba(255,255,255,0.2); border-radius: 10px;
            overflow: hidden; border: 2px solid white; display: none;
        }
        #power-bar { width: 0%; height: 100%; background: linear-gradient(to right, #4ade80, #facc15, #ef4444); }

        #win-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.9); color: #333; padding: 40px;
            border-radius: 30px; text-align: center; display: none; pointer-events: auto;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
        }

        button {
            padding: 12px 30px; font-size: 18px; cursor: pointer;
            background: #10b981; color: white; border: none;
            border-radius: 8px; transition: transform 0.1s, background 0.2s;
        }
        button:hover { background: #059669; transform: scale(1.05); }

        #instruction {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            font-size: 14px; opacity: 0.8; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="scoreboard">Strokes: <span id="stroke-count">0</span></div>
    <div id="power-container"><div id="power-bar"></div></div>
    <div id="instruction">Click & Drag the Ball back to Aim (Slingshot)</div>
    <div id="win-screen">
        <h1 style="margin: 0;">HOLE IN ONE! 🎉</h1>
        <p id="final-score"></p>
        <button onclick="location.reload()">Play Again</button>
    </div>
</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import initRapier from 'https://esm.sh/@dimforge/rapier3d-compat@0.11.2';

/** CONFIG **/
const TUNE = {
    ballMass: 1.0,
    ballRestitution: 0.5,
    ballFriction: 0.4,
    impulseScale: 2.5,
    gravity: -9.81,
};

/** STATE **/
let scene, camera, renderer, world;
let ballMesh, ballBody;
let holeMesh, holeSensor;
let isDragging = false;
let dragStartPoint = new THREE.Vector3();
let currentDragPoint = new THREE.Vector3();
let strokes = 0;
let canShoot = true;
let lastTime = 0;

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

async function init() {
    await initRapier();
    world = new Rapier.World({ x: 0.0, y: TUNE.gravity, z: 0.0 });

    initThree();
    createLevel();
    createBall();
    createHole();

    window.addEventListener('resize', onWindowResize);
    window.addEventListener('mousedown', onMouseDown);
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);

    requestAnimationFrame(animate);
}

function initThree() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 20, 100);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 15, 15);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(scene).texture;
}

function createLevel() {
    // Ground
    const groundGeo = new THREE.BoxGeometry(40, 2, 60);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x348C3D });
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.position.y = -1;
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    let groundBodyDesc = Rapier.RigidBodyDesc.fixed();
    let groundBody = world.createRigidBody(groundBodyDesc);
    world.createCollider(Rapier.ColliderDesc.cuboid(20, 1, 30), groundBody);

    // Walls
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x2D5A27 });
    addWall(0, 1, -30, 40, 2, 1, wallMat); // Back
    addWall(-20, 1, 0, 1, 2, 60, wallMat); // Left
    addWall(20, 1, 0, 1, 2, 60, wallMat);  // Right
    addWall(0, 1, 30, 40, 2, 1, wallMat);  // Front

    createObstacleBox(-8, 0.5, -10, 4, 1, 6, 0.4);
    createRamp(8, 0, -5, 4, 1, 3);

    const grid = new THREE.GridHelper(80, 40, 0x00ff00, 0x224422);
    grid.position.y = 0.01;
    scene.add(grid);
}

function addWall(x, y, z, w, h, d, mat) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    let bodyDesc = Rapier.RigidBodyDesc.fixed();
    let body = world.createRigidBody(bodyDesc);
    world.createCollider(Rapier.ColliderDesc.cuboid(w/2, h/2, d/2), body);
}

function createObstacleBox(x, y, z, w, h, d, rot) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: 0xe74c3c }));
    mesh.position.set(x, y, z);
    mesh.rotation.z = rot;
    mesh.castShadow = true;
    scene.add(mesh);
    let bodyDesc = Rapier.RigidBodyDesc.fixed();
    let body = world.createRigidBody(bodyDesc);
    world.createCollider(Rapier.ColliderDesc.cuboid(w/2, h/2, d/2), body);
}

function createRamp(x, y, z, w, h, d) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 0.5, d), new THREE.MeshStandardMaterial({ color: 0xf1c40f }));
    mesh.position.set(x, y, z);
    mesh.rotation.x = -Math.PI / 8;
    mesh.castShadow = true;
    scene.add(mesh);
    let bodyDesc = Rapier.RigidBodyDesc.fixed();
    let body = world.createRigidBody(bodyDesc);
    world.createCollider(Rapier.ColliderDesc.cuboid(w/2, 0.25, d/2), body);
}

function createBall() {
    const ballGeo = new THREE.SphereGeometry(0.4, 32, 32);
    const ballMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.1, metalness: 0.1, clearcoat: 1.0 });
    ballMesh = new THREE.Mesh(ballGeo, ballMat);
    ballMesh.castShadow = true;
    scene.add(ballMesh);

    let bodyDesc = Rapier.RigidBodyDesc.dynamic().setTranslation(0, 1, 20).setCanSleep(false);
    ballBody = world.createRigidBody(bodyDesc);
    let colliderDesc = Rapier.ColliderDesc.sphere(0.4);
    colliderDesc.setRestitution(TUNE.ballRestitution);
    colliderDesc.setFriction(TUNE.ballFriction);
    world.createCollider(colliderDesc, ballBody);
}

function createHole() {
    const holeGeo = new THREE.CylinderGeometry(0.8, 1, 0.2, 32);
    holeMesh = new THREE.Mesh(holeGeo, new THREE.MeshBasicMaterial({ color: 0x111111 }));
    holeMesh.position.set(0, -0.45, -15);
    scene.add(holeMesh);

    let bodyDesc = Rapier.RigidBodyDesc.kinematicPositionBased();
    holeSensor = world.createRigidBody(bodyDesc);
    world.createCollider(Rapier.ColliderDesc.cylinder(0.8, 0.2), holeSensor).setSensor(true);
}

/** CONTROLS **/
function onMouseDown(event) {
    if (!canShoot) return;
    updateMousePos(event);
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObject(ballMesh);

    if (intersects.length > 0) {
        isDragging = true;
        canShoot = false;
        getMouseWorldPos(dragStartPoint);
        document.getElementById('power-container').style.display = 'block';
    }
}

function onMouseMove(event) {
    if (!isDragging) return;
    updateMousePos(event);
    getMouseWorldPos(currentDragPoint);
    const dir = new THREE.Vector3().subVectors(dragStartPoint, currentDragPoint);
    document.getElementById('power-bar').style.width = `${Math.min((dir.length() / 5) * 100, 100)}%`;
}

function onMouseUp() {
    if (!isDragging) return;
    isDragging = false;
    document.getElementById('power-container').style.display = 'none';

    const dir = new THREE.Vector3().subVectors(dragStartPoint, currentDragPoint);
    const force = Math.min(dir.length() * TUNE.impulseScale, 15);

    if (force > 0.2) {
        strokes++;
        document.getElementById('stroke-count').innerText = strokes;
        ballBody.applyImpulse(dir.normalize().x * force, 0, dir.normalize().z * force, true);
        setTimeout(() => { canShoot = true; }, 1000);
    } else {
        canShoot = true;
    }
}

function updateMousePos(event) {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
}

function getMouseWorldPos(targetVec) {
    raycaster.setFromCamera(mouse, camera);
    raycaster.intersectPlane(plane, targetVec);
}

/** LOOP **/
function animate(time) {
    const dt = (time - lastTime) / 1000;
    lastTime = time;
    if (dt < 0.1) world.step();

    // Sync Visuals
    const pos = ballBody.translation();
    const rot = ballBody.rotation();
    ballMesh.position.set(pos.x, pos.y, pos.z);
    ballMesh.rotation.set(rot.i, rot.j, rot.k);

    // Camera follow
    camera.position.lerp(new THREE.Vector3(ballMesh.position.x, ballMesh.position.y + 12, ballMesh.position.z + 10), 0.05);
    camera.lookAt(ballMesh.position.x, ballMesh.position.y, ballMesh.position.z);

    // Win Check
    const dist = ballMesh.position.distanceTo(holeMesh.position);
    if (dist < 0.8 && Math.abs(ballBody.linvel().x) < 1) {
        document.getElementById('win-screen').style.display = 'block';
        document.getElementById('final-score').innerText = `Strokes: ${strokes}`;
    }

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

init();
</script>
</body>
</html>
